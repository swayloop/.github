name: ✨ Feature Request
description: 새로운 기능이나 개선을 제안합니다
title: "[Feature] "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 이 제안이 해결하려는 문제는 무엇인가요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떻게 해결하면 좋을까요?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있나요?

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
