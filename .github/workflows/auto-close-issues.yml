name: Auto Close Issues on PR Merge (reusable)

# PR 본문의 `close[s|d] #N`, `fix(es|ed) #N`, `resolve[s|d] #N` 패턴을 찾아
# 머지 시 해당 이슈를 자동으로 close 합니다.
#
# 사용 예 (caller workflow):
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [dev]   # 또는 [dev, main]
#   jobs:
#     auto-close:
#       if: github.event.pull_request.merged == true
#       uses: swayloop/.github/.github/workflows/auto-close-issues.yml@main
#       permissions:
#         issues: write

on:
  workflow_call:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            let match;
            while ((match = pattern.exec(body)) !== null) {
              const issueNumber = parseInt(match[1], 10);
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                });
                console.log(`Closed issue #${issueNumber}`);
              } catch (e) {
                console.log(`Failed to close issue #${issueNumber}: ${e.message}`);
              }
            }
