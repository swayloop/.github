name: Node pnpm CI (reusable)

# Reusable workflow for Node/pnpm repositories.
#
# Caller workflow example:
#
#   name: CI
#   on:
#     pull_request:
#       branches: [main, dev]
#   jobs:
#     ci:
#       uses: swayloop/.github/.github/workflows/node-pnpm-ci.yml@main
#
# This workflow runs package scripts only when they exist:
# format:check, lint, typecheck, build, test.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      working-directory:
        description: "Directory containing package.json"
        required: false
        type: string
        default: "."
      # Which commit to check. Leave empty for the event default (PR merge ref).
      #
      # Needed when a job earlier in the same run pushed a commit — e.g. a review
      # bot that auto-fixes findings. Commits pushed with GITHUB_TOKEN do not
      # re-trigger workflows, so the only way to get CI onto that code is to order
      # this job after the fix and point it at the resulting SHA.
      ref:
        description: "Commit/branch to check out (default: event default)"
        required: false
        type: string
        default: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Empty ref behaves exactly like omitting it, so existing callers are unaffected.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: |
          if jq -e '.scripts."format:check"' package.json > /dev/null; then
            pnpm format:check
          else
            echo "no format:check script, skipping"
          fi

      - name: Lint
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null; then
            pnpm lint
          else
            echo "no lint script, skipping"
          fi

      - name: Typecheck
        run: |
          if jq -e '.scripts.typecheck' package.json > /dev/null; then
            pnpm typecheck
          else
            echo "no typecheck script, skipping"
          fi

      - name: Build
        run: |
          if jq -e '.scripts.build' package.json > /dev/null; then
            pnpm build
          else
            echo "no build script, skipping"
          fi

      - name: Test
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            pnpm test
          else
            echo "no test script, skipping"
          fi
