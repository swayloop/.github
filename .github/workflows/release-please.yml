name: Release Please (reusable)

# Reusable workflow. 각 레포에서 아래처럼 호출:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: swayloop/.github/.github/workflows/release-please.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       with:
#         release-type: node   # node | python | go | simple | ...
#
# 자세한 설정은 https://github.com/swayloop/.github/blob/main/docs/changelog-automation.md

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release-type (node, python, go, simple, ...)"
        required: false
        type: string
        default: "node"
      config-file:
        description: "release-please config file path"
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "release-please manifest file path"
        required: false
        type: string
        default: ".release-please-manifest.json"
    secrets:
      # App 토큰용 개인 키. 미설정 레포는 GITHUB_TOKEN 으로 fallback 하므로 optional.
      # (선언하지 않으면 caller 가 secrets: inherit 를 넘겨야 하고, 참조 시 검증 실패 위험)
      RELEASE_BOT_PRIVATE_KEY:
        description: "GitHub App private key for release-please PRs (optional)"
        required: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # release-please 가 만든 release PR 이 다른 워크플로우(pr-source-branch-check 등)를
      # 트리거하려면 GITHUB_TOKEN 이 아닌 App 토큰으로 PR 을 만들어야 한다.
      # GITHUB_TOKEN 으로 생성된 이벤트는 무한루프 방지 정책상 워크플로우를 트리거하지 않음.
      #
      # App 미설정 레포는 이 step 을 건너뛰고 GITHUB_TOKEN 으로 fallback (기존 동작 유지).
      # 게이트는 vars 로 판단 — secrets 컨텍스트는 if: 표현식에서 사용할 수 없어
      # (Unrecognized named-value: 'secrets') 워크플로우가 startup 단계에서 invalid 처리된다.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
