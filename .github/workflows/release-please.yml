name: Release Please (reusable)

# Reusable workflow. 각 레포에서 아래처럼 호출:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: swayloop/.github/.github/workflows/release-please.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       with:
#         release-type: node   # node | python | go | simple | ...
#
# 자세한 설정은 https://github.com/swayloop/.github/blob/main/docs/changelog-automation.md

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release-type (node, python, go, simple, ...)"
        required: false
        type: string
        default: "node"
      config-file:
        description: "release-please config file path"
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "release-please manifest file path"
        required: false
        type: string
        default: ".release-please-manifest.json"

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # release-please 가 만든 release PR 이 다른 워크플로우(pr-source-branch-check 등)를
      # 트리거하려면 GITHUB_TOKEN 이 아닌 App 토큰으로 PR 을 만들어야 한다.
      # GITHUB_TOKEN 으로 생성된 이벤트는 무한루프 방지 정책상 워크플로우를 트리거하지 않음.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
