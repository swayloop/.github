name: Release Please (reusable)

# Reusable workflow. 각 레포에서 아래처럼 호출:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: swayloop/.github/.github/workflows/release-please.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       with:
#         release-type: node   # node | python | go | simple | ...
#
# 자세한 설정은 https://github.com/swayloop/.github/blob/main/docs/changelog-automation.md

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release-type (node, python, go, simple, ...)"
        required: false
        type: string
        default: "node"
      config-file:
        description: "release-please config file path"
        required: false
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "release-please manifest file path"
        required: false
        type: string
        default: ".release-please-manifest.json"

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
